[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localpod"
version = "0.1.0"
description = "Automated podcast production tool for local news publishers"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pydub>=0.25",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[tool.setuptools]
packages = ["localpod"]

[project.scripts]
localpod = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
